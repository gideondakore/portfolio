name: Deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      # Root user page (gideondakore.github.io) lives in its own repo, so the
      # build here has to be pushed cross-repo rather than published via
      # actions/deploy-pages, which only targets the repo the workflow runs in.
      - name: Publish to gideondakore.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: gideondakore/gideondakore.github.io
          publish_branch: main
          publish_dir: app/dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
